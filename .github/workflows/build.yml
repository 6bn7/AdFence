name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (build-tools)
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Build (unsigned keystore is generated automatically)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          KEYSTORE_PASS: ci-only-not-a-secret
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adfence-apk
          path: build/adfence.apk
          if-no-files-found: error
